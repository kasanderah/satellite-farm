:root{--void:#0a0c14;--line:rgba(188,195,196,.4);--fg:#e8d8d0;--mut:#a2998a;--sig:#d8693c;--data:#85eed9;

html,body{margin:0;background:var(--void);color:var(--fg);font-family:var(--font)}
body{padding:28px 32px 64px}
a{color:var(--data);text-decoration:none}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:8px}

.sub{color:var(--mut);font-size:13px;letter-spacing:.06em;line-height:1.6;max-width:640px}
#board{margin-top:22px;display:flex;flex-direction:column;gap:14px}
.stage{display:grid;grid-template-columns:minmax(180px,1.1fr) 36px minmax(200px,1.2fr) 36px minmax(180px,1.1fr);gap:8px 6px;align-items:center;border:1px solid var(--line);padding:14px 16px;background:rgba(23,24,28,.65)}
.col{display:flex;flex-direction:column;gap:8px}
.arr{text-align:center;color:var(--sig);font-size:22px;letter-spacing:0}
.chip,.proc{border:1px solid var(--line);padding:8px 10px}
.chip b,.proc b{display:block;font-weight:500;letter-spacing:.12em;font-size:14px}
.chip small,.proc small,.chip em,.proc em{display:block;font-style:normal;color:var(--mut);font-size:12px;letter-spacing:.04em;margin-top:3px}
.chip.out em{color:var(--sig)}
.chip.in em{color:var(--data)}
.dev,.off,.note{grid-column:1 / -1;margin:0;color:var(--mut);font-size:12px;letter-spacing:.04em;line-height:1.5}
.caps{border:1px solid var(--line);padding:14px 16px}
.caps h2{margin:0 0 8px;font-weight:500;font-size:13px;letter-spacing:.2em}
.caps ul{margin:0;padding-left:18px}
.caps li{margin:4px 0;font-size:13px;letter-spacing:.04em}
@media (max-width:800px){
  .stage{grid-template-columns:1fr}
  .arr{transform:rotate(90deg);padding:4px 0}
}
</style></head><body>
