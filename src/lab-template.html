<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>环穗 · 资产工坊</title>
<style>
@font-face{font-family:"BarlowSC";font-weight:400;src:url(data:font/woff;base64,__FONT_R__) format("woff")}
@font-face{font-family:"BarlowSC";font-weight:500;src:url(data:font/woff;base64,__FONT_M__) format("woff")}
:root{--void:#0a0c14;--line:rgba(188,195,196,.4);--fg:#e8d8d0;--mut:#a2998a;--sig:#d8693c;--zone:#e49680;
  --font:"BarlowSC","PingFang SC","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC","WenQuanYi Micro Hei","Droid Sans Fallback",sans-serif}
html,body{margin:0;height:100%;background:var(--void);color:var(--fg);font-family:var(--font);-webkit-font-smoothing:antialiased}
body{display:grid;grid-template-rows:52px 1fr;overflow:hidden}
header{display:flex;align-items:center;gap:16px;padding:0 16px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.brand i{width:16px;height:16px;border:1px solid var(--fg);position:relative;display:block}
.brand i:after{content:"";position:absolute;left:3px;top:3px;width:8px;height:8px;background:var(--sig)}
.brand b{display:block;font-weight:500;font-size:14px;letter-spacing:.18em}
.brand small{display:block;margin-top:2px;font-size:10px;letter-spacing:.14em;color:var(--mut)}
#back{margin-left:auto;color:var(--fg);text-decoration:none;font-size:12px;letter-spacing:.16em;border:1px solid var(--line);padding:4px 10px}
#back:hover{border-color:var(--sig);color:var(--sig)}
main{display:grid;grid-template-columns:220px 1fr 268px;min-height:0}
#catalog{border-right:1px solid var(--line);overflow:auto;padding:6px 0 18px}
.cls{font-size:10px;letter-spacing:.22em;color:var(--mut);padding:14px 14px 4px}
.ent{display:block;width:100%;text-align:left;font:inherit;color:var(--fg);background:transparent;border:0;border-left:2px solid transparent;padding:6px 14px 6px 18px;cursor:pointer;letter-spacing:.08em;font-size:13px}
.ent.on{border-left-color:var(--sig);color:var(--zone)}
#view{position:relative;min-width:0;min-height:0;background:#0a0c14}
#view canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#view canvas:active{cursor:grabbing}
#states{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:6px;z-index:2}
#lights{position:absolute;left:50%;bottom:56px;transform:translateX(-50%);display:none;gap:6px;align-items:center;z-index:2}
#section{position:absolute;left:50%;bottom:94px;transform:translateX(-50%);display:none;gap:6px;align-items:center;z-index:2}
#lights i,#section i{font-style:normal;font-size:10px;letter-spacing:.18em;color:var(--mut)}
#states button,#lights button,#section button,#brief button{font:inherit;color:var(--fg);background:rgba(10,12,20,.72);border:1px solid var(--line);padding:5px 12px;letter-spacing:.14em;cursor:pointer;font-size:12px}
#states button.on,#lights button.on,#section button.on{border-color:var(--sig);color:var(--zone)}
#lights button.off{color:var(--mut)}
#hint{position:absolute;right:14px;bottom:16px;font-size:10px;letter-spacing:.12em;color:var(--mut);text-align:right;line-height:1.6;z-index:2}
#brief{border-left:1px solid var(--line);padding:14px 14px 18px;overflow:auto;display:flex;flex-direction:column;gap:10px}
#brief label{display:flex;flex-direction:column;gap:4px;font-size:10px;letter-spacing:.2em;color:var(--mut)}
#brief input,#brief textarea{font:inherit;color:var(--fg);background:transparent;border:1px solid var(--line);padding:6px 8px;letter-spacing:.06em;font-size:13px;resize:vertical}
#brief textarea{min-height:220px;line-height:1.5}
#brief .foot{margin-top:8px;font-size:11px;letter-spacing:.06em;color:var(--mut);line-height:1.55}
main.field-on{grid-template-columns:200px 1fr 360px}
#brief-form{display:flex;flex-direction:column;gap:10px;min-height:0}
#brief-form[hidden],#field-panel[hidden],#fieldbar[hidden],#machine-panel[hidden]{display:none !important}
#fieldbar{position:absolute;left:12px;right:12px;bottom:12px;z-index:2;display:flex;flex-direction:column;gap:6px;background:rgba(10,12,20,.82);border:1px solid var(--line);padding:8px 10px}
#fieldbar button,#field-panel button{font:inherit;color:var(--fg);background:transparent;border:1px solid var(--line);padding:4px 8px;letter-spacing:.08em;cursor:pointer;font-size:12px}
#fieldbar button.on,#field-panel button.on{border-color:var(--sig);color:var(--zone)}
#field-panel{display:flex;flex-direction:column;gap:8px}
.fs-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.fs-gantt{display:block;height:auto;width:100%;overflow-x:auto}
.fs-battery{display:flex;gap:3px;align-items:stretch;min-width:100%;box-sizing:border-box;padding:4px;border:1px solid rgba(188,195,196,.45);background:rgba(10,12,20,.45)}
.fs-battery button{flex:1 1 0;min-width:0;height:auto;padding:3px 2px 4px;display:flex;flex-direction:column;gap:2px;align-items:stretch;justify-content:flex-end;border:1px solid rgba(10,12,20,.35);cursor:pointer}
.fs-battery button.on{border-color:#d8693c;box-shadow:inset 0 0 0 1px #d8693c}
.fs-battery button.inf{min-width:52px;background-image:repeating-linear-gradient(90deg, transparent, transparent 7px, rgba(255,255,255,.22) 7px, rgba(255,255,255,.22) 8px)}
.fs-wins{position:relative;height:8px}
.fs-win{position:absolute;top:1px;height:6px}
.fs-win.soft{background:#7eb6d6}
.fs-win.hard{background:#c4503a}
.fs-battery button b{font-size:10px;font-weight:500;letter-spacing:.02em;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#fs-board{position:absolute;left:12px;right:12px;top:12px;bottom:188px;z-index:4;display:flex;flex-direction:column;background:rgba(10,12,20,.94);border:1px solid rgba(188,195,196,.45);overflow:hidden;touch-action:none}
#fs-board[hidden]{display:none !important}
.fs-board-tools{display:flex;flex-wrap:wrap;gap:6px;padding:8px 8px 0;position:relative;z-index:2}
#fs-board button{font:inherit;color:var(--fg);background:transparent;border:1px solid var(--line);padding:4px 8px;letter-spacing:.08em;cursor:pointer;font-size:12px}
#fs-board button:hover,#fs-board button.on{border-color:var(--sig);color:var(--zone)}
#fs-graph{position:relative;flex:1;min-height:0;overflow:auto}
#fs-canvas{position:relative;width:960px;height:560px}
#fs-wires{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
#fs-nodes{position:absolute;inset:0}
.fs-node{position:absolute;width:112px;min-height:58px;box-sizing:border-box;padding:7px 8px;background:#141820;border:1px solid rgba(188,195,196,.55);cursor:grab;z-index:1;user-select:none}
.fs-node small{display:block;font-size:10px;letter-spacing:.12em;color:var(--mut)}
.fs-node b{display:block;font-weight:500;font-size:13px;letter-spacing:.06em;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fs-node em{display:block;margin-top:2px;font-style:normal;font-size:10px;letter-spacing:.04em}
.fs-node.head{border-color:#d8693c}
.fs-node.node{border-color:rgba(232,216,208,.7)}
.fs-node.rot,.fs-node.tail{background-image:repeating-linear-gradient(90deg, transparent, transparent 7px, rgba(255,255,255,.1) 7px, rgba(255,255,255,.1) 8px)}
.fs-node.soft{border-color:#7eb6d6;width:108px}
.fs-node.hard{border-color:#c4503a;width:108px}
.fs-node.exit{width:68px;min-height:44px;border-style:dashed}
.fs-node.on{box-shadow:inset 0 0 0 1px #d8693c}
.fs-port{position:absolute;width:10px;height:10px;border:1px solid var(--fg);background:#0a0c14;cursor:crosshair}
.fs-port.in{left:-6px;top:50%;margin-top:-5px}
.fs-port.out{right:-6px;top:50%;margin-top:-5px;background:#d8693c}
.fs-port.hang{left:50%;bottom:-6px;margin-left:-5px;background:#7eb6d6}
.fs-port.up{left:50%;top:-6px;margin-left:-5px}
#fs-prop{position:absolute;right:8px;top:44px;width:188px;z-index:3;display:flex;flex-direction:column;gap:6px;padding:8px;background:rgba(10,12,20,.94);border:1px solid rgba(188,195,196,.4)}
#fs-prop:empty{display:none}
#fs-prop label{display:flex;flex-direction:column;gap:3px;font-size:10px;letter-spacing:.12em;color:var(--mut)}
#fs-prop input,#fs-prop select{font:inherit;color:var(--fg);background:#0a0c14;border:1px solid var(--line);padding:4px 6px;font-size:12px}
#fs-prop .fs-cut{display:flex;justify-content:space-between;gap:6px;align-items:center;font-size:11px;letter-spacing:.04em}
.fs-empty{padding:28px 18px;color:var(--mut);font-size:13px;letter-spacing:.06em;line-height:1.6}
.fs-battery button small{font-size:9px;letter-spacing:.04em;line-height:1.1}
.fs h3{margin:0;font-size:13px;font-weight:500;letter-spacing:.16em}
.fs p{margin:0}
.fs label{display:flex;flex-direction:column;gap:4px;font-size:10px;letter-spacing:.14em;color:var(--mut)}
.fs-lab{display:inline-flex;align-items:center;gap:6px}
.qmark{width:16px;height:16px;padding:0;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--fg);font:inherit;font-size:11px;line-height:14px;letter-spacing:0;cursor:help;display:inline-flex;align-items:center;justify-content:center}
.fs input,.fs select{font:inherit;color:var(--fg);background:#0a0c14;border:1px solid var(--line);padding:4px 6px;font-size:13px;letter-spacing:.04em}
.fs input[type="color"]{padding:0;height:26px;width:100%}
.fs-split{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.fs-stage{display:grid;grid-template-columns:1fr 72px;gap:6px;align-items:center}
.fs-stage button{text-align:left}
#fs-curve{width:100%;height:148px;background:#10131c;border:1px solid var(--line);touch-action:none;cursor:crosshair;display:block}
.fs-help,.fs-note{font-size:11px;line-height:1.55;color:var(--mut);letter-spacing:.03em}
.fs-jobs{display:flex;flex-direction:column;gap:8px}
.fs-jobs h4{margin:0;font-size:11px;font-weight:500;letter-spacing:.14em}
.fs-jobbars{display:flex;flex-direction:column;gap:3px}
.fs-jobbar{display:flex;align-items:center;gap:8px;min-height:16px}
.fs-jobbar i{width:72px;height:10px;flex:none;display:block}
.fs-jobbar span{font-size:11px;letter-spacing:.06em}
.fs-job{display:flex;flex-direction:column;gap:4px;padding:6px 0;border-top:1px solid var(--line)}
.fs-job b{font-weight:500;font-size:12px;letter-spacing:.06em}
#fs-status{font-size:12px;letter-spacing:.06em;line-height:1.45}
.me-mode{display:flex;flex-direction:column;gap:6px;padding:8px 0;border-top:1px solid var(--line)}
.me-mode-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.me-mode-h b{font-weight:500;font-size:12px;letter-spacing:.08em}
.me-attr{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}
.me-sync{flex-direction:row !important;align-items:center;gap:4px;font-size:11px;letter-spacing:.04em;color:var(--fg);white-space:nowrap;padding-bottom:4px}
.me-sync input{width:auto}
#me-status{font-size:12px;letter-spacing:.04em;line-height:1.45}
</style></head><body>
<header>
  <div class="brand"><i></i><div><b>环穗 · 资产工坊</b><small>设计沙盒 · 定稿后由主进度接入</small></div></div>
  <a id="back" href="index.html">回到环穗</a>
</header>
<main>
  <nav id="catalog"></nav>
  <div id="view">
    <div id="section"></div>
    <div id="lights"></div>
    <div id="states">
      <button type="button" data-s="idle">空闲</button>
      <button type="button" data-s="job">作业</button>
      <button type="button" data-s="sel">选中</button>
      <button type="button" data-s="break">损坏</button>
    </div>
    <div id="fieldbar" hidden></div>
    <div id="hint">拖动 旋转 · 右键 平移 · 滚轮 缩放<br>1–4 状态 · 灯组可关</div>
  </div>
  <aside id="brief">
    <div id="brief-form">
    <label>名称<input id="b-name" autocomplete="off"></label>
    <label>类别<input id="b-cls" autocomplete="off"></label>
    <label>模数<input id="b-size" autocomplete="off"></label>
    <label>备注<textarea id="b-notes"></textarea></label>
    <div class="foot">备注只留在这台浏览器里，不写入环穗存档。</div>
    </div>
    <div id="field-panel" class="fs" hidden></div>
    <div id="machine-panel" class="fs" hidden></div>
  </aside>
</main>
<script>__BUNDLE__</script>
</body></html>
